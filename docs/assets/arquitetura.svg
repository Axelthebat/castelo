<svg viewBox="0 0 890 275" width="890" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fluxo de uma jogada no Castelo">
  <title>Fluxo de uma jogada no Castelo</title>
  <desc>O lance sai do navegador, passa pelo hub WebSocket, é validado pelo LiveGame e pela Position do motor, e é persistido no SQLite. O bot responde pelo mesmo caminho.</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="890" height="275" fill="#ffffff"/>

  <g transform="translate(-5, 0)">
    <text x="450" y="32" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Fluxo de uma jogada</text>

    <!-- Caixas: x=30/200/380/560/740, y=90, altura 54, espaçamento 30px -->
    <rect x="30" y="90" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="100" y="113" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Navegador</text>
    <text x="100" y="130" font-size="10" fill="#1e40af" text-anchor="middle">game:move</text>

    <rect x="200" y="90" width="150" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="275" y="113" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Hub WebSocket</text>
    <text x="275" y="130" font-size="10" fill="#b45309" text-anchor="middle">autentica o cookie</text>

    <rect x="380" y="90" width="150" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="455" y="113" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">LiveGame</text>
    <text x="455" y="130" font-size="10" fill="#b45309" text-anchor="middle">turno e relógio</text>

    <rect x="560" y="90" width="150" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
    <text x="635" y="113" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">Position</text>
    <text x="635" y="130" font-size="10" fill="#6b21a8" text-anchor="middle">revalida o lance</text>

    <rect x="740" y="90" width="130" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
    <text x="805" y="113" font-size="12" font-weight="600" fill="#166534" text-anchor="middle">SQLite</text>
    <text x="805" y="130" font-size="10" fill="#166534" text-anchor="middle">histórico e PGN</text>

    <!-- Conectores horizontais: 5px na origem, 11px no destino -->
    <path d="M175,117 L189,117" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M355,117 L369,117" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M535,117 L549,117" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M715,117 L729,117" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Ramo do bot: 26px abaixo do LiveGame -->
    <rect x="380" y="170" width="150" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
    <text x="455" y="193" font-size="12" font-weight="600" fill="#6b21a8" text-anchor="middle">Bot</text>
    <text x="455" y="210" font-size="10" fill="#6b21a8" text-anchor="middle">busca alfa-beta</text>

    <path d="M430,149 L430,159" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <path d="M480,165 L480,155" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="390" y="161" font-size="10" fill="#64748b" text-anchor="end">pede lance</text>
    <text x="520" y="161" font-size="10" fill="#64748b" text-anchor="start">devolve lance</text>

    <text x="450" y="250" font-size="10" fill="#64748b" text-anchor="middle">Azul: cliente · Âmbar: autoridade · Roxo: motor · Verde: persistência</text>
  </g>
</svg>
